<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Explorer</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<style>
  :root {
    color-scheme: light;
    --bg: #faf9f7; --panel: #fff; --border: #e7e4df; --text: #1f1e1c; --muted: #77736c;
    --accent: #c4623f; --sel: #f3ede6; --code: #f4f2ee;
    /* memory types = first 4 slots of the validated categorical palette (fixed order) */
    --t-project: #2a78d6; --t-feedback: #eb6834; --t-reference: #1baf7a; --t-user: #eda100; --t-other: #9a968f;
    /* activity (usage) series: ink, so they are never confused with types */
    --ink-series: #52514e; --ink-soft: #d3d0ca;
    --grid: #ecebe7; --axis: #8a867f; --dots: #e6e3de; --edge: #b4b0a9;
    --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #1a1918; --panel: #222120; --border: #34322f; --text: #ecebe8; --muted: #9a968f;
      --accent: #e08360; --sel: #2f2c29; --code: #2a2826;
      --t-project: #3987e5; --t-feedback: #d95926; --t-reference: #199e70; --t-user: #c98500; --t-other: #77736c;
      --ink-series: #c3c2b7; --ink-soft: #4a4845;
      --grid: #2e2c2a; --axis: #8a867f; --dots: #2d2b29; --edge: #5e5b56;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); display: grid; grid-template-columns: 248px 360px 1fr; }
  body:not([data-view="memories"]) { grid-template-columns: 248px 1fr; }
  body:not([data-view="memories"]) > section { display: none; }
  a { color: inherit; text-decoration: none; }
  body > aside, body > section, main { height: 100vh; overflow-y: auto; }
  body > section { border-right: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; }
  main { padding: 32px 44px; }
  .muted { color: var(--muted); } .small { font-size: 12px; } .nowrap { white-space: nowrap; }
  kbd { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--muted); background: var(--panel); }

  /* Sidebar */
  body > aside { border-right: 1px solid var(--border); padding: 16px 12px 0; display: flex; flex-direction: column; overflow: hidden; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 6px 18px; }
  .logo { width: 30px; height: 30px; flex-shrink: 0; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 3px 10px rgba(0,0,0,.10); }
  .brand b { display: block; font-size: 14px; line-height: 1.2; }
  .brand #sub { font-size: 11.5px; color: var(--muted); }
  #views { display: flex; flex-direction: column; gap: 2px; margin-bottom: 18px; }
  .nav { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; color: var(--muted); font-weight: 500; }
  .nav span:first-of-type { flex: 1; }
  .nav:hover { background: var(--sel); color: var(--text); }
  .nav.sel { background: var(--panel); color: var(--text); box-shadow: 0 0 0 1px var(--border), 0 1px 3px rgba(0,0,0,.06); }
  .nav.sel svg { color: var(--accent); }
  .nav kbd { opacity: 0; transition: opacity .15s; }
  .nav:hover kbd, .nav.sel kbd { opacity: 1; }
  .badge { min-width: 18px; padding: 0 5px; border-radius: 9px; font-size: 10.5px; line-height: 18px; text-align: center; background: var(--warning); color: #000; font-weight: 700; }
  .side-title { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; padding: 0 10px 6px; }
  #pfilter { margin: 0 2px 6px; padding: 5px 9px; border: 1px solid var(--border); border-radius: 7px; background: var(--panel); color: inherit; font: inherit; font-size: 12.5px; }
  #projects { flex: 1; overflow-y: auto; margin: 0 -12px; padding: 0 12px 8px; }
  .proj { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 8px; }
  .proj:hover { background: var(--sel); }
  .proj.sel { background: var(--sel); }
  .proj .mono { width: 26px; height: 26px; border-radius: 7px; background: var(--sel); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--muted); flex-shrink: 0; border: 1px solid var(--border); }
  .proj.sel .mono { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pname { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.3; }
  .pname span, .pname small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .proj.sel .pname span { font-weight: 600; }
  .pname small { font-size: 11px; color: var(--muted); }
  .proj .count { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .pwarn { width: 7px; height: 7px; border-radius: 50%; background: var(--warning); flex-shrink: 0; }
  .proj.gone .pname span { color: var(--muted); }
  .side-empty { color: var(--muted); font-size: 12px; padding: 6px 10px; }
  #side-foot { border-top: 1px solid var(--border); margin: 0 -12px; padding: 10px 12px 10px 18px; display: flex; align-items: center; gap: 8px; font-size: 11.5px; line-height: 1.35; }
  .foot-text { flex: 1; min-width: 0; }
  .live { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--good); margin-right: 6px; vertical-align: 1px; }
  .live.busy { animation: pulse 1s infinite; }
  .spin { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -1px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 50% { opacity: .3; } }
  .icon-btn { border: 0; background: none; color: var(--muted); width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; cursor: pointer; flex-shrink: 0; }
  .icon-btn:hover { background: var(--sel); color: var(--text); }

  /* Memory list */
  .toolbar { padding: 12px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--panel); z-index: 1; }
  input[type=search] { width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 7px; background: var(--bg); color: inherit; font: inherit; }
  input[type=search]:focus, #pfilter:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; align-items: center; }
  .chip { border: 1px solid var(--border); background: none; color: var(--muted); border-radius: 99px; padding: 1px 9px; font: inherit; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
  .chip i, .tag i, .legend i, .glegend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; }
  .chip.on { color: var(--text); border-color: currentColor; }
  #sort { margin-left: auto; font: inherit; font-size: 12px; color: var(--muted); background: none; border: 1px solid var(--border); border-radius: 6px; padding: 1px 4px; }
  .list { flex: 1; }
  body > section { scroll-padding-top: 180px; } /* keep the sticky toolbar from covering the selected item */
  .item { display: block; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .item:hover { background: var(--sel); }
  .item.sel { background: var(--sel); box-shadow: inset 3px 0 var(--accent); }
  .item .title { font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .item .desc { color: var(--muted); font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .item .meta { color: var(--muted); font-size: 11px; margin-top: 2px; }
  .unread { color: var(--muted); font-style: italic; }
  .tag { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); flex-shrink: 0; }
  .tag.index { background: var(--text); color: var(--bg); padding: 0 6px; border-radius: 4px; }
  .empty { color: var(--muted); padding: 30px 14px; text-align: center; }
  mark { background: #f7d774; color: #000; border-radius: 2px; }

  /* Memory detail */
  article { max-width: 760px; }
  article .head h2 { margin: 6px 0 4px; font-size: 22px; }
  article .head .desc { color: var(--muted); font-size: 15px; margin: 0 0 12px; }
  .facts { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; color: var(--muted); font-size: 12px; padding-bottom: 12px; }
  .facts code { font-size: 11.5px; }
  .facts-link { color: var(--accent); font-weight: 500; }
  .usage { font-size: 13px; padding: 10px 12px; background: var(--sel); border-radius: 8px; margin-bottom: 18px; }
  .usage .muted { font-size: 11.5px; margin-top: 2px; }
  .copy { border: 0; background: none; color: var(--accent); cursor: pointer; font: inherit; font-size: 12px; padding: 0; }
  /* File view: the .md line by line */
  .doc-page { max-width: 860px; }
  .hsec code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: .88em; }
  .hsec a, .backlinks a { color: var(--accent); }
  .doc-title { margin: 0 0 6px; font-size: 24px; line-height: 1.25; letter-spacing: -.01em; }
  .meta-line { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; font-size: 13px; color: var(--muted); margin-bottom: 18px; }
  .meta-line .tag { font-size: 11px; }
  .dot-sep { opacity: .5; }
  .usage-inline { color: var(--text); border-bottom: 1px dotted var(--axis); cursor: help; }
  .usage-inline.unread { color: var(--muted); font-style: italic; }
  .file { border: 1px solid var(--border); border-radius: 10px; background: var(--panel); overflow: hidden; }
  .file-bar { display: flex; align-items: center; gap: 12px; padding: 6px 8px 6px 16px; border-bottom: 1px solid var(--border); background: var(--panel); position: sticky; top: 0; z-index: 1; }
  .file-name { font: 600 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-meta { flex: 1; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .file-bar .icon-btn { width: 26px; height: 26px; }
  .doc, .raw { padding: 12px 0 16px; }
  .ln { display: flex; }
  .ln .no { flex: 0 0 48px; padding-right: 16px; text-align: right; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; font-weight: 400; font-style: normal; color: var(--axis); opacity: .55; user-select: none; }
  .ln:hover .no { opacity: 1; color: var(--text); }
  .ln .tx { flex: 1; min-width: 0; padding-right: 24px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .doc { font-size: 15px; line-height: 1.65; }
  .doc .ln .no { line-height: 25px; }
  .doc .h .no { line-height: 1.35; font-size: 11.5px; }
  .mk { color: var(--muted); opacity: .6; font-weight: 400; font-style: normal; }
  /* frontmatter: literal YAML, values aligned in a column per nesting level */
  .doc .fm { font: 13px/1.8 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--bg); }
  .doc .fm .no { line-height: inherit; }
  .doc .fm .tx { display: flex; }
  .doc .fm-start { margin-top: -12px; padding-top: 10px; }
  .doc .fm-end { padding-bottom: 10px; margin-bottom: 12px; border-bottom: 1px solid var(--border); }
  .fm-key { flex-shrink: 0; white-space: pre; color: var(--muted); }
  .fm-k { color: var(--accent); }
  .fm-val { flex: 1; min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text); }
  .fm-type { display: inline-flex; align-items: center; gap: 6px; }
  .fm-type i { width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
  .fm-note { display: block; margin: -2px 0 2px; font: 12px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--muted); user-select: none; }
  .doc .blank .tx { min-height: 25px; }
  .doc .h .tx { font-weight: 700; line-height: 1.35; padding-top: 6px; }
  .doc .h .no { padding-top: 6px; }
  .doc .h1 .tx { font-size: 1.55em; } .doc .h2 .tx { font-size: 1.3em; } .doc .h3 .tx { font-size: 1.12em; }
  .doc .code { font: 13px/1.65 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--code); }
  .doc .code .no { line-height: inherit; }
  .doc .quote .tx { color: var(--muted); font-style: italic; }
  .doc .hr .tx { background: linear-gradient(var(--border), var(--border)) center / 100% 1px no-repeat; }
  .doc .table .tx { font: 13px/1.75 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .li-mk { color: var(--accent); font-weight: 600; }
  .doc .tx code { font: .86em ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--code); padding: 1px 4px; border-radius: 4px; }
  .doc .tx a { color: var(--accent); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--accent) 35%, transparent); text-underline-offset: 2px; }
  .doc .tx .broken { color: var(--muted); text-decoration: line-through dotted; }
  .raw { font: 12.5px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .backlinks { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--border); font-size: 13px; }
  .backlinks h4 { margin: 0 0 6px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .backlinks a { display: inline-block; margin-right: 12px; }
  .placeholder { color: var(--muted); margin-top: 30vh; text-align: center; }

  /* Stats and health pages */
  .page { max-width: 1240px; }
  .page-head h2 { margin: 0; font-size: 22px; }
  .page-head p { margin: 2px 0 18px; color: var(--muted); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin-bottom: 22px; }
  .tile { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; display: block; }
  .tile-label { font-size: 12px; color: var(--muted); }
  .tile-value { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.25; }
  .tile-value small { font-size: 14px; font-weight: 400; color: var(--muted); }
  .tile-sub { font-size: 12px; color: var(--muted); }
  .tile.check:hover { border-color: var(--muted); }
  .tile.check .status { margin-top: 6px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(520px, 1fr)); gap: 14px; }
  .chart { margin: 0; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px 10px; }
  .chart h3 { margin: 0; font-size: 14px; }
  .chart figcaption p { margin: 1px 0 8px; font-size: 12px; color: var(--muted); }
  .chart svg { width: 100%; height: auto; display: block; overflow: visible; }
  .chart-empty { color: var(--muted); padding: 30px 0; text-align: center; font-size: 13px; }
  .chart .grid { stroke: var(--grid); stroke-width: 1; }
  .chart .baseline, .chart .tick { stroke: var(--axis); stroke-width: 1; }
  .chart .ref { stroke: var(--critical); stroke-width: 1.5; stroke-dasharray: 4 3; }
  .chart .axis { fill: var(--axis); font-size: 11px; }
  .chart .label { fill: var(--text); font-size: 12px; }
  .chart .value { fill: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .chart .hit { fill: transparent; cursor: default; }
  .chart a .hit, .chart a .label { cursor: pointer; }
  .chart a:hover .label { fill: var(--accent); }
  .chart rect.hit.hover { fill: var(--text); fill-opacity: .05; }
  .chart circle.hit.hover { fill: var(--text); fill-opacity: .12; }
  .chart .ringed { stroke: var(--panel); stroke-width: 2; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .legend span, .glegend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; }
  .legend i.line { width: 16px; height: 0; border-radius: 0; background: none; }
  .datatable { font-size: 12px; margin-top: 4px; }
  .datatable summary { color: var(--muted); cursor: pointer; width: max-content; }
  .datatable table { border-collapse: collapse; margin: 6px 0; }
  .datatable td, .datatable th { padding: 2px 10px 2px 0; text-align: left; border-bottom: 1px solid var(--border); }
  .datatable .num { text-align: right; font-variant-numeric: tabular-nums; }
  #tip { position: fixed; left: 0; top: 0; display: none; pointer-events: none; z-index: 10; background: var(--text); color: var(--bg); font-size: 12px; padding: 6px 9px; border-radius: 6px; max-width: 320px; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
  #tip strong { display: block; font-weight: 600; }
  .status { display: inline-flex; align-items: flex-start; gap: 6px; font-size: 12.5px; }
  .status b { flex-shrink: 0; display: inline-grid; place-items: center; width: 16px; height: 16px; margin-top: 2px; border-radius: 50%; font-size: 10.5px; color: #fff; }
  .status.good b { background: var(--good); } .status.warning b { background: var(--warning); color: #000; }
  .status.critical b { background: var(--critical); } .status.info b { background: var(--muted); }
  .hsec { margin: 0 0 28px; max-width: 1000px; }
  .hsec h3 { font-size: 16px; margin: 0 0 2px; }
  .hsec h3 .count { color: var(--muted); font-weight: 400; }
  .hsec > p { margin: 2px 0 10px; font-size: 13px; }
  .htable { border-collapse: collapse; width: 100%; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; font-size: 13px; }
  .htable th { text-align: left; font-size: 11.5px; font-weight: 600; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--border); }
  .htable td { padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .htable tr:last-child td { border-bottom: 0; }
  .meter { width: 120px; height: 6px; background: var(--grid); border-radius: 3px; overflow: hidden; margin: 6px 0 3px; }
  .meter span { display: block; height: 100%; border-radius: 3px; }
  .meter.good span { background: var(--good); } .meter.warning span { background: var(--warning); } .meter.critical span { background: var(--critical); }

  /* Timeline */
  .page-timeline { max-width: 980px; }
  .heatmap { width: fit-content; max-width: 100%; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px 10px; margin-bottom: 16px; overflow-x: auto; }
  .hm-months { display: grid; gap: 0; margin-left: 30px; font-size: 11px; color: var(--muted); height: 16px; }
  .hm-months span { white-space: nowrap; }
  .hm-body { display: flex; gap: 6px; }
  .hm-days { display: grid; grid-template-rows: repeat(7, 11px); gap: 3px; font-size: 9.5px; color: var(--muted); width: 24px; line-height: 11px; }
  .hm-grid { display: flex; gap: 3px; }
  .hm-col { display: grid; grid-template-rows: repeat(7, 11px); gap: 3px; }
  .heatmap i { display: block; width: 11px; height: 11px; border-radius: 3px; }
  .hm-0 { background: var(--grid); }
  .hm-1 { background: color-mix(in srgb, var(--ink-series) 28%, var(--panel)); }
  .hm-2 { background: color-mix(in srgb, var(--ink-series) 50%, var(--panel)); }
  .hm-3 { background: color-mix(in srgb, var(--ink-series) 74%, var(--panel)); }
  .hm-4 { background: var(--ink-series); }
  .hm-out { background: none; }
  .heatmap i[data-day] { cursor: pointer; }
  .heatmap i[data-day]:hover { outline: 2px solid var(--accent); outline-offset: 1px; }
  .hm-legend { display: flex; align-items: center; justify-content: flex-end; gap: 3px; font-size: 11px; color: var(--muted); margin-top: 8px; }
  .hm-legend i { width: 10px; height: 10px; }
  .tl-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-bottom: 18px; }
  .tl-bar .muted { margin-left: 6px; }
  .tl-chip .tl-dot { position: static; width: 8px; height: 8px; margin: 0; border-width: 0; }
  .timeline { position: relative; }
  .tl-day { position: relative; margin-bottom: 18px; border-radius: 10px; transition: background .4s; }
  .tl-day.flash { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .tl-date { position: sticky; top: 0; z-index: 2; display: flex; align-items: baseline; gap: 12px; padding: 10px 0 8px; background: var(--bg); }
  .tl-date b { font-size: 14px; }
  .tl-date span { font-size: 12px; color: var(--muted); }
  .tl-item { position: relative; display: grid; grid-template-columns: 48px 22px 1fr; align-items: start; padding: 3px 0; }
  .tl-item::before { content: ""; position: absolute; left: 58px; top: 0; bottom: 0; width: 2px; background: var(--border); }
  .tl-day .tl-item:last-child::before { bottom: 50%; }
  .tl-time { font: 11.5px/22px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); text-align: right; padding-right: 2px; }
  .tl-dot { position: relative; z-index: 1; width: 10px; height: 10px; border-radius: 50%; margin: 6px 0 0 6px; border: 2px solid var(--bg); box-sizing: content-box; }
  /* event kinds: accent / ink / grey — status colours stay reserved for Health */
  .tl-dot.created { background: var(--accent); } .tl-dot.edited { background: var(--ink-series); } .tl-dot.read { background: var(--axis); }
