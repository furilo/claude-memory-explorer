<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Claude Memory Explorer</title>
  <!-- Ink tile with a hairline so it reads on dark backgrounds too -->
  <rect width="32" height="32" rx="8" fill="#1f1e1c"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
  <!-- A tiny memory graph: links -->
  <path d="M7.6 12.2L21 8.6M7.6 12.2l5.4 9.3M21 8.6l-8 12.9M21 8.6l1.6 11.9" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Memories coloured by type (project, feedback, reference); the big one is read a lot (halo) -->
  <circle cx="13" cy="21.5" r="6.2" fill="#1baf7a" fill-opacity="0.22"/>
  <circle cx="13" cy="21.5" r="4" fill="#1baf7a" stroke="#1f1e1c" stroke-width="1.2"/>
  <circle cx="7.6" cy="12.2" r="3.4" fill="#3987e5" stroke="#1f1e1c" stroke-width="1.2"/>
  <circle cx="21" cy="8.6" r="2.7" fill="#eb6834" stroke="#1f1e1c" stroke-width="1.2"/>
  <!-- …and one that was never read (hollow) -->
  <circle cx="22.6" cy="20.5" r="2.1" fill="#1f1e1c" stroke="#c3c2b7" stroke-width="1.4"/>
</svg>
